name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: entryrank-debug-apk
        path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          🎉 EntryRank Android APK - Guest Mode Demo
          
          ## What's New
          - ✅ Guest Mode: Test without account!
          - ✅ 50 practice questions per subject
          - ✅ 4 subjects (Physics, Chemistry, Math, Biology)
          - ✅ Works 100% offline
          - ✅ All features unlocked
          
          ## How to Install
          1. Download `app-dev-debug.apk`
          2. Install on Android device
          3. Open app
          4. Click "Skip Login - Try as Guest"
          5. Start using!
          
          ## Requirements
          - Android 8.0+ (API 26)
          - ~100 MB storage
          - No internet needed (guest mode)
        files: app/build/outputs/apk/dev/debug/app-dev-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
